name: Build Android APK (전국당꼴)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build APK with Gradle 8.5
      run: |
        TARGET_DIR=$(find . -type d -name "android" | head -n 1)
        echo "안드로이드 폴더: $TARGET_DIR"

        ASSETS_DIR="$TARGET_DIR/app/src/main/assets"
        mkdir -p "$ASSETS_DIR"
        find . -name "index.html" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "app.js" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "style.css" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "icon.png" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;

        python3 -c "from PIL import Image; import glob, os; src = glob.glob('**/icon.png', recursive=True)[0] if glob.glob('**/icon.png', recursive=True) else None; [os.makedirs(os.path.join('$TARGET_DIR/app/src/main/res', f), exist_ok=True) or [Image.open(src).convert('RGBA').resize((sz, sz)).save(os.path.join('$TARGET_DIR/app/src/main/res', f, n), 'PNG') for n in ['ic_launcher.png', 'ic_launcher_round.png']] for f, sz in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192),('drawable',512)]] if src else print('no icon')" || true

        MANIFEST="$TARGET_DIR/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' "$MANIFEST"
          sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' "$MANIFEST"
        fi

        cd "$TARGET_DIR"
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 전국당꼴-debug-apk
        path: "**/app-debug.apk"
        retention-days: 30
