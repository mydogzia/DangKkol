name: Build Android APK (전국당꼴)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Build APK with Gradle 8.5
      run: |
        TARGET_DIR=$(find . -type d -name "android" | head -n 1)
        echo "안드로이드 폴더: $TARGET_DIR"
        cd "$TARGET_DIR"

        # AndroidX 필수 설정 자동 주입
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 전국당꼴-debug-apk
        path: "**/app-debug.apk"
        retention-days: 30
