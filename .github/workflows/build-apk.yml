name: Build Android APK (전국당꼴)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses || true

    - name: Build APK with Gradle 8.5
      run: |
        TARGET_DIR=$(find . -type d -name "android" | head -n 1)
        echo "안드로이드 폴더: $TARGET_DIR"

        ASSETS_DIR="$TARGET_DIR/app/src/main/assets"
        mkdir -p "$ASSETS_DIR"
        find . -name "index.html" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "app.js" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "style.css" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;
        find . -name "icon.png" -not -path "*/assets/*" -exec cp -f {} "$ASSETS_DIR/" \;

        RES_DIR="$TARGET_DIR/app/src/main/res"
        ICON_SRC=$(find . -name "icon.png" -not -path "*/assets/*" -not -path "*/res/*" | head -n 1)

        # 1. Pillow 라이브러리 자동 설치
        python3 -m pip install pillow --break-system-packages 2>/dev/null || python3 -m pip install pillow 2>/dev/null || true

        # 2. 스마트폰 앱 아이콘 해상도별 생성 스크립트
        cat << 'EOF' > generate_icons.py
import sys, os
try:
    from PIL import Image
    src = sys.argv[1]
    res_dir = sys.argv[2]
    img = Image.open(src).convert('RGBA')
    sizes = {
        'mipmap-mdpi': 48,
        'mipmap-hdpi': 72,
        'mipmap-xhdpi': 96,
        'mipmap-xxhdpi': 144,
        'mipmap-xxxhdpi': 192,
        'drawable': 512
    }
    for folder, sz in sizes.items():
        out_dir = os.path.join(res_dir, folder)
        os.makedirs(out_dir, exist_ok=True)
        resized = img.resize((sz, sz), Image.Resampling.LANCZOS)
        resized.save(os.path.join(out_dir, 'ic_launcher.png'), 'PNG')
        resized.save(os.path.join(out_dir, 'ic_launcher_round.png'), 'PNG')
    print("성공: 아이콘이 해상도별로 정상 생성되었습니다.")
except Exception as e:
    print(f"아이콘 생성 에러: {e}")
    sys.exit(1)
EOF

        if [ -n "$ICON_SRC" ]; then
          python3 generate_icons.py "$ICON_SRC" "$RES_DIR" || (
            echo "대체 모드: 아이콘 직접 복사"
            for f in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi drawable; do
              mkdir -p "$RES_DIR/$f"
              cp -f "$ICON_SRC" "$RES_DIR/$f/ic_launcher.png"
              cp -f "$ICON_SRC" "$RES_DIR/$f/ic_launcher_round.png"
            done
          )
        fi

        MANIFEST="$TARGET_DIR/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' "$MANIFEST"
          sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' "$MANIFEST"
        fi

        cd "$TARGET_DIR"
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        gradle wrapper --gradle-version 8.5 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 전국당꼴-debug-apk
        path: "**/app-debug.apk"
        retention-days: 30
